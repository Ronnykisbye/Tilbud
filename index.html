<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neon-Spar 2026</title>
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="theme_tokens.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="dark-mode"> <div id="app">
        <header>
            <div class="top-row">
                <button id="theme-toggle" class="mini-btn" onclick="toggleTheme()">🌓</button>
                <div class="stepper">TRIN <span id="step-num">1</span> AF 4</div>
            </div>
            <h1 id="title">Find Butikker</h1>
            <p id="location-display" class="status-text"></p>
        </header>

        <main id="content">
            <section id="step-1" class="step-view">
                <button class="btn-3d primary" onclick="getGPS()">📍 BRUG MIN POSITION</button>
                <div class="spacer">eller</div>
                <div class="autocomplete">
                    <input type="text" id="city-search" placeholder="Indtast by..." class="input-3d" oninput="suggestCity(this.value)">
                    <div id="city-suggestions" class="suggestions"></div>
                </div>
                <div class="range-container">
                    <label>Søgeradius: <span id="rad-val">5</span> km</label>
                    <input type="range" min="1" max="50" value="5" class="radius-slider" oninput="updateRad(this.value)">
                </div>
            </section>

            <section id="step-2" class="step-view" style="display:none">
                <p class="hint">Hvad skal du bruge?</p>
                <div class="item-grid">
                    <div class="autocomplete">
                        <input type="text" class="input-3d item-input" placeholder="Vare 1..." oninput="suggestProduct(this)">
                    </div>
                    <div class="autocomplete">
                        <input type="text" class="input-3d item-input" placeholder="Vare 2..." oninput="suggestProduct(this)">
                    </div>
                    <div class="autocomplete">
                        <input type="text" class="input-3d item-input" placeholder="Vare 3..." oninput="suggestProduct(this)">
                    </div>
                    <div class="autocomplete">
                        <input type="text" class="input-3d item-input" placeholder="Vare 4..." oninput="suggestProduct(this)">
                    </div>
                </div>
                <div id="item-suggestions" class="suggestions"></div>
            </section>

            <section id="step-3" class="step-view" style="display:none">
                <button class="btn-3d secondary" onclick="selectAllStores()">✅ VÆLG ALLE BUTIKKER</button>
                <div id="store-list" class="store-grid">
                    </div>
            </section>

            <section id="step-4" class="step-view" style="display:none">
                <div id="best-price-card" class="result-3d">
                    </div>
            </section>
        </main>

        <nav class="bottom-nav">
            <button onclick="changeStep(-1)" id="back-btn" class="nav-btn-text">← RETUR</button>
            <button onclick="changeStep(1)" class="btn-3d nav-next" id="next-btn">NÆSTE</button>
        </nav>
    </div>

    <script src="data_mock.js"></script>
    <script src="logic.js"></script>
</body>
</html>
